{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block content %}
<h4>{{ t('reports.title') }}</h4>
<p class="text-muted">{{ t('reports.desc') }}</p>
<div class="row g-3">
  {% for period in ['daily','weekly','monthly'] %}
  <div class="col-md-4">
    <div class="card shadow-sm h-100">
      <div class="card-body text-center">
        <i class="bi bi-file-earmark-text fs-1 text-primary"></i>
        <h5 class="mt-2">{{ t('reports.' + period) }}</h5>
        <a class="btn btn-outline-danger btn-sm mt-2" href="{{ url_for('reports.generate', period=period, fmt='pdf') }}">
          <i class="bi bi-filetype-pdf"></i> PDF
        </a>
        <a class="btn btn-outline-success btn-sm mt-2" href="{{ url_for('reports.generate', period=period, fmt='csv') }}">
          <i class="bi bi-filetype-csv"></i> CSV
        </a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
