{% extends "base.html" %}
{% block title %}Login - SecureWatch{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
 <div class="col-md-5">
  <div class="card shadow">
   <div class="card-body p-4">
    <h3 class="card-title text-center mb-3"><i class="bi bi-shield-lock"></i> SecureWatch</h3>
    {% if mode == 'login' %}
     <form method="post" action="{{ url_for('auth.login') }}">
       <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
       <div class="mb-3">
         <label>{{ t('login.username') }}</label>
         <input class="form-control" name="username" required>
       </div>
       <div class="mb-3">
         <label>{{ t('login.password') }}</label>
         <input type="password" class="form-control" name="password" required>
       </div>
       <div class="form-check mb-3">
         <input class="form-check-input" type="checkbox" name="remember">
         <label class="form-check-label">{{ t('login.remember') }}</label>
       </div>
       <button class="btn btn-primary w-100">{{ t('login.submit') }}</button>
       <p class="text-center mt-3">
         {{ t('login.no_account') }} <a href="{{ url_for('auth.register') }}">{{ t('login.register_link') }}</a>
       </p>
     </form>
    {% else %}
     <form method="post" action="{{ url_for('auth.register') }}">
       <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
       <div class="mb-3">
         <label>{{ t('login.username') }}</label>
         <input class="form-control" name="username" required>
       </div>
       <div class="mb-3">
         <label>Email</label>
         <input type="email" class="form-control" name="email" required>
       </div>
       <div class="mb-3">
         <label>{{ t('login.password') }}</label>
         <input type="password" class="form-control" name="password" minlength="8" required>
       </div>
       <button class="btn btn-success w-100">{{ t('register.submit') }}</button>
       <p class="text-center mt-3">
         {{ t('register.have_account') }} <a href="{{ url_for('auth.login') }}">{{ t('login.submit') }}</a>
       </p>
     </form>
    {% endif %}
   </div>
  </div>
 </div>
</div>
{% endblock %}
