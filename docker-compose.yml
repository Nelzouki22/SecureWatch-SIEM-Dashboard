services:
  securewatch:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=docker-secret-change-me
      - DATABASE_URL=sqlite:////app/database/siem.db
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./reports:/app/reports
    restart: unless-stopped